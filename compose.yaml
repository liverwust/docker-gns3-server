name: gns3-server
services:
    gns3-server:
        container_name: gns3-server
        network_mode: host
        privileged: true
        environment:
            - BRIDGE_ADDRESS=172.21.1.1/24
        volumes:
            - /data/gns3:/data
            - /var/run/docker.sock:/var/run/docker.sock
            - /root/.local/share/GNS3:/root/.local/share/GNS3
        image: liverwust/gns3-server:3.0.5-liverwust1
